# TEMPORARY: tests install.sh for PR #1 on real distros (removed before merge)
name: test install.sh

on:
  push:
    branches: [claude/hopeful-aryabhata-ec5b30]
  workflow_dispatch:

jobs:
  distro:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: arch-migrate,  image: "archlinux:latest", family: arch,   script: "arch-migrate.sh" }
          - { name: arch-install,  image: "archlinux:latest", family: arch,   script: "fresh-install.sh arch" }
          - { name: ubuntu-install, image: "ubuntu:24.04",    family: ubuntu, script: "fresh-install.sh ubuntu" }
          - { name: fedora-install, image: "fedora:latest",   family: fedora, script: "fresh-install.sh fedora" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run test in container
        run: |
          docker run --rm \
            -v "$PWD:/src:ro" -v "$PWD/tests/install:/tests:ro" \
            -e NEW_REF="$(git rev-parse HEAD)" -e WT=/src \
            "${{ matrix.image }}" bash /tests/run.sh ${{ matrix.family }} ${{ matrix.script }}

  arch-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check package names
        run: |
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/tests/install:/tests:ro" \
            -e NEW_REF="$(git rev-parse HEAD)" archlinux:latest bash /tests/arch-packages.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck install.sh
        run: shellcheck --version && shellcheck -S warning install.sh
