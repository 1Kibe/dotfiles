# hypridle comes back if it stops for any reason (a crash or a plain kill),
# so the idle lock and the lock before sleeping never silently go away.
# The package's unit only restarts on failure.
[Service]
Restart=always
RestartSec=2
# The idle warning (Quickshell's veil) belongs to this daemon: if it stops
# or crashes during the warning, clear it, or it stays until the next
# warning. "-": no Quickshell running is fine; timeout: a frozen Quickshell
# must not hold the restart (no lock before sleeping meanwhile).
ExecStopPost=-/usr/bin/timeout 3 /usr/bin/qs ipc call lock undim
