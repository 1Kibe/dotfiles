# hypridle: idle times of the Hyprland session (started by autostart.lua,
# through hypr-hypridle). The general block below is always this one. The
# listeners after the "Listeners" line are the defaults: hypr-hypridle
# swaps them for the times chosen in Configurações → Energia (the shell's
# hypridle.gerado.conf) when that file is valid, and keeps these otherwise.
# Same defaults as the Windows "Balanced" plan, the same on battery and on
# power, except suspending:
#
#   4 min 30 s  the screen dims, with a 30 s countdown to the lock
#   5 min       locks (hypr-travar, through loginctl lock-session)
#   5 min 10 s  the screen turns off
#   60 min      suspends, on battery only (hypr-energia-ociosa)
#
# Any key or mouse move undoes the dim and turns the screen back on. A video
# playing holds it all (the player asks the compositor not to idle); music
# does not. Closing the lid locks too: logind sleeps through before_sleep_cmd,
# and the lid bind in keybinds.lua covers a lid closed with a monitor plugged
# in (no sleep then).

general {
    # loginctl lock-session (below and before sleeping) lands here
    lock_cmd = hypr-travar
    # Before sleeping (lid, suspend from anywhere): lock first
    before_sleep_cmd = loginctl lock-session
    # Waking up: lock again (in case sleep came without the lock) and only
    # then turn the screen on, so it never lights up unlocked
    after_sleep_cmd = hypr-travar && hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    # Hold the sleep until the lock is confirmed (hypr-travar's 4.5 s fit
    # inside logind's 5 s)
    inhibit_sleep = 3
}

# ── Listeners ──

# The 30 of "dim 30" is the countdown on the warning: the lock's timeout
# minus this one (300 − 270). Change it together with them. 2 s at most: a
# frozen Quickshell never answers, and its calls must not pile up here (the
# lock below goes through hypr-travar, which has its own reserve).
listener {
    timeout = 270
    on-timeout = timeout 2 qs ipc call lock dim 30
    on-resume = timeout 2 qs ipc call lock undim
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 310
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 3600
    on-timeout = hypr-energia-ociosa suspender
}
