# hyprlock: the RESERVE lock screen. hypr-travar only starts it when the
# Quickshell lock screen (lock/LockScreen.qml) does not confirm the lock in
# time (Quickshell not running or frozen). Same look as ours: the background
# from the background picker, the clock and the date, the password field;
# nothing from the session (no music, notices or network). PAM: the package's
# /etc/pam.d/hyprlock (→ login → system-auth, with faillock).
#
# Colors from quickshell/theme/Theme.qml (Gruvbox); "##" is a literal "#"
# inside a label's markup.

general {
    hide_cursor = false
    ignore_empty_input = true
    # Plain bg_deep at once, the picture as soon as it is read
    immediate_render = true
    fail_timeout = 2000
    # No screen copy: the background is the picture, not the desktop. On a
    # virtual machine (vmwgfx) Hyprland refuses the copy and hyprlock aborts
    # right after locking, leaving the session in the "lock screen died" state
    disable_screencopy = true
}

# The picture is already blurred and darkened (BackgroundPicker made it):
# shown as it is. Without it, plain bg_deep, like ours.
background {
    monitor =
    path = /usr/local/share/dotfiles/login/fundo.png
    color = rgb(20, 22, 23)
    blur_passes = 0
}

# Clock and date, where ours are
label {
    monitor =
    text = $TIME
    color = rgb(255, 255, 255)
    font_size = 64
    font_family = Agave Nerd Font Propo
    position = 0, 120
    halign = center
    valign = center
}

# "segunda-feira, 9 de novembro" from fixed names (no locale needed)
label {
    monitor =
    text = cmd[update:30000] date '+%u %-d %m' | awk '{ split("segunda-feira terça-feira quarta-feira quinta-feira sexta-feira sábado domingo", d, " "); split("janeiro fevereiro março abril maio junho julho agosto setembro outubro novembro dezembro", m, " "); print d[$1] ", " $2 " de " m[$3 + 0] }'
    color = rgba(255, 255, 255, 0.85)
    font_size = 15
    font_family = Agave Nerd Font Propo
    position = 0, 70
    halign = center
    valign = center
}

# The password pill: ours is 300×44, bg_hard at 75%, no outline until
# something happens (checking, wrong password, Caps Lock)
input-field {
    monitor =
    size = 300, 44
    rounding = -1
    outline_thickness = 2
    outer_color = rgba(29, 32, 33, 0.0)
    inner_color = rgba(29, 32, 33, 0.75)
    font_color = rgb(255, 255, 255)
    font_family = Agave Nerd Font Propo
    dots_size = 0.2
    dots_spacing = 0.35
    fade_on_empty = false
    placeholder_text = <span foreground="##a89984">Senha</span>
    check_color = rgb(168, 153, 132)
    check_text = <span foreground="##a89984">Conferindo…</span>
    fail_color = rgb(251, 73, 52)
    fail_text = <span foreground="##fb4934">Senha incorreta</span>
    capslock_color = rgb(250, 189, 47)
    position = 0, 0
    halign = center
    valign = center
}

# Caps Lock: the keyboard LEDs, read twice a second
label {
    monitor =
    text = cmd[update:500] for f in /sys/class/leds/*::capslock/brightness; do [ -r "$f" ] && [ "$(cat "$f")" != 0 ] && { echo '󰌎  Caps Lock ligado'; exit 0; }; done; echo ''
    color = rgb(250, 189, 47)
    font_size = 14
    font_family = Agave Nerd Font Propo
    position = 0, -45
    halign = center
    valign = center
}

# Says that the shell failed and this is the reserve
label {
    monitor =
    text = Bloqueio reserva
    color = rgb(168, 153, 132)
    font_size = 11
    font_family = Agave Nerd Font Propo
    position = 0, 24
    halign = center
    valign = bottom
}
