# Kitty: the terminal of both sessions (Hyprland and XFCE).
# Agave Nerd Font Mono 11 and Gruvbox Dark Hard, like the rest of the
# dotfiles. The colors below are the fallback: cores.conf, written by the
# shell from its theme (Configurações), comes after them.

# ── Font ──
font_family      Agave Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11

# ── Cursor ──
# A 3 px beam that blinks with a fade and leaves a short trail when it
# jumps. The fade redraws every frame, so it stops after 15 s without a
# key: the animation never runs on its own for long.
cursor_shape                 beam
cursor_beam_thickness        2.25
cursor_blink_interval        0.5 ease-in-out
cursor_stop_blinking_after   15
cursor_trail                 1
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 1

# ── Window ──
# 12 px between the text and the window's edge (9 pt at 96 dpi), on all
# four sides; what is left of the cell grid is split evenly
window_padding_width 9
placement_strategy   center
# Closing the window never asks
confirm_os_window_close 0
scrollback_lines 10000
enable_audio_bell no
# Redraw at once while the window is resized: with the default wait, Kitty
# shows "W by H cells" over the text until the size settles
resize_debounce_time 0 0

# ── Safety and updates ──
# No remote control socket: nothing else can drive the terminal
allow_remote_control no
# The package manager updates it
update_check_interval 0

# ── Colors (Gruvbox Dark Hard) ──
background #1d2021
foreground #ebdbb2
cursor     #ebdbb2
# The text under the cursor in the background color
cursor_text_color background
selection_background #504945
# The selected text keeps its own color
selection_foreground none

# Normal
color0 #1d2021
color1 #cc241d
color2 #98971a
color3 #d79921
color4 #458588
color5 #b16286
color6 #689d6a
color7 #a89984
# Bright
color8  #928374
color9  #fb4934
color10 #b8bb26
color11 #fabd2f
color12 #83a598
color13 #d3869b
color14 #8ec07c
color15 #ebdbb2
# Orange: 208 of the 256 colors, used by the prompt (starship.toml); the 16
# above have none
color208 #d65d0e

# ── Generated and local files ──
# Both are optional: a glob that matches nothing includes nothing.
# The theme's colors, written by the shell (not in git)
globinclude cores.conf
# This machine only (not in git), last so it wins: e.g. a plain blink on a
# machine without a GPU, where the fade costs a lot of CPU
globinclude local*.conf
