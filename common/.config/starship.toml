# Bash prompt (Starship), one line: user · folder · git (inside a repo
# only) and the arrow, in the accent color, red after a command that failed.
# Colors by ANSI name only (and 208/250, set by Kitty from the shell's theme:
# orange and the accent), never hex: the prompt follows Kitty's palette.
"$schema" = "https://starship.rs/config-schema.json"
add_newline = false

format = "$username$directory$git_branch$git_status$character"

[username]
show_always = true
style_user = "bright-yellow"
style_root = "bright-red bold"
format = "[$user]($style)[ · ](bright-black)"

# Up to three folders ("…/" when cut), from the home folder (~)
[directory]
style = "bright-blue"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false
format = "[$path]($style)"

[git_branch]
symbol = " "
style = "bright-cyan"
format = "[ · ](bright-black)[$symbol$branch]($style)"

# e.g. "main !1": the count after each sign, in orange
[git_status]
style = "fg:208"
format = "([ $all_status$ahead_behind]($style))"
modified = "!${count}"
untracked = "?${count}"
staged = "+${count}"
deleted = "✘${count}"
renamed = "»${count}"
conflicted = "=${count}"
stashed = "\\$${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

[character]
success_symbol = "[ ❯](fg:250)"
error_symbol = "[ ❯](bright-red)"
format = "$symbol "
