# mpv with the uosc interface (package mpv-uosc), in the shell's Gruvbox.
# Default video player (install.sh: set_default_apps).

# uosc is installed in /usr/share/mpv, which mpv doesn't read by itself
script=/usr/share/mpv/scripts/uosc
osd-fonts-dir=/usr/share/mpv/fonts

# uosc draws the controls, the timeline and the volume
osc=no
osd-bar=no
border=no
osd-font=Agave Nerd Font Propo

# The video stays open at the end, with the controls
keep-open=yes
# Hardware decoding when the GPU has it (notebook); software otherwise (VM)
hwdec=auto-safe
# VMs (LIBGL_ALWAYS_SOFTWARE in local.lua) only have a software renderer: use
# it instead of falling back to X11, which crashes mpv 0.41
gpu-sw=yes
