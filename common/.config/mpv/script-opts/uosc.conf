# uosc options that differ from its defaults (the rest come from the script).
# Colors are the shell's (quickshell/theme/Theme.qml), RGB without '#':
# fg ebdbb2, bg 282828, bgHard 1d2021, green b8bb26, red fb4934,
# yellow fabd2f, blue 83a598.
color=foreground=ebdbb2,foreground_text=282828,background=282828,background_text=ebdbb2,window_border=1d2021,curtain=1d2021,success=b8bb26,error=fb4934,match=fabd2f,heatmap=83a598
border_radius=8
# Portuguese menus and labels, then the subtitle language
languages=pt,slang,en
