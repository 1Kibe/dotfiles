[font]
# Same as the Windows Terminal: Agave Nerd Font Mono 11, Gruvbox Dark Hard
normal = { family = "Agave Nerd Font Mono", style = "Regular" }
bold = { family = "Agave Nerd Font Mono", style = "Bold" }
italic = { family = "Agave Nerd Font Mono", style = "Italic" }
size = 11

[colors.primary]
background = "#1d2021"
foreground = "#ebdbb2"

[colors.cursor]
text = "CellBackground"
cursor = "#ebdbb2"

[colors.selection]
text = "CellForeground"
background = "#504945"

[colors.normal]
black   = "#1d2021"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"

[colors.bright]
black   = "#928374"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#ebdbb2"

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 500
blink_timeout = 0
