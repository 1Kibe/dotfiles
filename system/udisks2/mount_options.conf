# udisks2 mount options (installed to /etc/udisks2/mount_options.conf by
# install.sh). Every filesystem udisks mounts for the user (Configurações →
# Dispositivos, Thunar, gio) gets noexec,nosuid,nodev,nosymfollow, and "exec"
# is no longer allowed, so no caller can ask for it. ntfs mounts with the
# kernel's ntfs3, never the fuse driver.
# The lists are udisks 2.11's built-in ones (see
# /etc/udisks2/mount_options.conf.example) without "exec" and without vfat's
# "showexec"; the common defaults= line and ntfs3's "windows_names" are
# added. The built-in lists have neither nofail nor x-gvfs-show.

[defaults]
defaults=noexec,nosuid,nodev,nosymfollow
allow=noexec,nodev,nosuid,atime,noatime,nodiratime,relatime,strictatime,lazytime,ro,rw,sync,dirsync,noload,acl,nosymfollow

vfat_defaults=uid=$UID,gid=$GID,shortname=mixed,utf8=1,flush
vfat_allow=uid=$UID,gid=$GID,flush,utf8,shortname,umask,dmask,fmask,codepage,iocharset,usefree

exfat_defaults=uid=$UID,gid=$GID,iocharset=utf8,errors=remount-ro
exfat_allow=uid=$UID,gid=$GID,umask,dmask,fmask,allow_utime,iocharset,errors,discard,keep_last_dots,sys_tz,time_offset,zero_size_dir,namecase,codepage

ntfs_drivers=ntfs3
ntfs:ntfs3_defaults=uid=$UID,gid=$GID,windows_names
ntfs:ntfs3_allow=uid=$UID,gid=$GID,umask,dmask,fmask,iocharset,discard,nodiscard,sparse,nosparse,hidden,nohidden,sys_immutable,nosys_immutable,showmeta,noshowmeta,prealloc,noprealloc,hide_dot_files,nohide_dot_files,windows_names,nocase,case
