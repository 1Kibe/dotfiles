# greetd: shows the Quickshell login screen (system/greetd/quickshell, inside
# the cage kiosk compositor) on VT 1. Copied to /etc/greetd/ by install.sh,
# together with start-greeter, which sets the keyboard and, on a virtual
# machine, the software renderer.
[terminal]
vt = 1

[default_session]
command = "/etc/greetd/start-greeter"
user = "greeter"
