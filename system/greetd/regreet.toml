# ReGreet (login screen) for every environment, same look as the desktop.
# Copied to /etc/greetd/ by install.sh; the wallpaper goes to
# /usr/share/backgrounds/dotfiles/ (the greeter can't read your home).
[background]
path = "/usr/share/backgrounds/dotfiles/login.png"
fit = "Cover"

[GTK]
application_prefer_dark_theme = true
theme_name = "Adwaita-dark"
icon_theme_name = "breeze-dark"
cursor_theme_name = "Bibata-Modern-Classic-Right"
font_name = "Agave Nerd Font Propo 11"

[commands]
reboot = ["systemctl", "reboot"]
poweroff = ["systemctl", "poweroff"]
# X11 sessions (Xfce, i3) start their own X server
x11_prefix = ["startx", "/usr/bin/env"]

[widget.clock]
format = "%a %d/%m  %H:%M"
# The system locale may be one ReGreet can't parse (pt-PT); day names in Portuguese
locale = "pt_BR"
