# LightDM GTK greeter (login screen) for the xfce environment, same look as
# the desktop. install.sh copies this file to /etc/lightdm/ and the wallpaper
# to /usr/share/backgrounds/dotfiles/: the greeter runs as the lightdm user and
# can't read files in your home.
[greeter]
theme-name = Adwaita-dark
icon-theme-name = breeze-dark
cursor-theme-name = Bibata-Modern-Classic-Right
cursor-theme-size = 24
font-name = Agave Nerd Font Propo 11
background = /usr/share/backgrounds/dotfiles/login.png
user-background = false
